<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Carniflora: Breach</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Carniflora: Breach</h1>
        <div class="stats">
          <span>Spores <b id="sp">0</b></span
          ><span>Level <b id="lv">1</b></span
          ><span>Enemies <b id="tw">0</b></span>
          <span>Max Towers <b id="tc">0 / 0</b></span>
        </div>
      </header>
      <div class="stage">
        <canvas
          id="c"
          width="960"
          height="540"
          aria-label="Game field"
        ></canvas>
        <div id="ov">
          <div class="box">
            <h2 id="ot"></h2>
            <p id="om"></p>
            <button class="ctl" id="ob"></button>
          </div>
        </div>
      </div>
      <div class="cards" id="cards"></div>
      <div class="row">
        <button class="ctl" id="pz">Pause (P)</button
        ><button class="ctl" id="rs">Restart level</button
        ><span class="hint"
          >Keys 1-4 send plants. Spores regenerate over time.</span
        >
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
