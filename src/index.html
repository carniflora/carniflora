<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carniflora Tower Offence</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <header class="game-header">
            <h1>Carniflora Tower Offence</h1>
            <div class="resource-display">
                <span class="sun">🌞 Sun: <span id="sun-count">100</span></span>
                <span class="minerals">💎 Minerals: <span id="minerals-count">50</span></span>
                <span class="wave">Wave: <span id="wave-number">1</span></span>
            </div>
        </header>

        <div class="game-area">
            <div class="grid-container" id="game-grid">
                <!-- Grid will be generated by JavaScript -->
            </div>

            <!-- Canvas overlay for defense projectiles and tower rendering -->
            <canvas id="game-canvas" width="800" height="400"></canvas>

            <div class="plant-selector">
                <h3>Select Plant</h3>
                <div class="plants" id="plant-selection">
                    <!-- Plants will be generated by JavaScript -->
                </div>
            </div>

            <div class="plant-info-panel" id="plant-info-panel">
                <!-- Plant information will be displayed here -->
            </div>
        </div>

        <div class="game-controls">
            <button id="start-game">Start Game</button>
            <button id="pause-game">Pause</button>
            <button id="next-wave">Next Wave</button>
            <button id="continue-btn" style="display:none;">Continue</button>
        </div>

        <div class="game-status" id="game-status">
            <p>Wave 1 - Enemies: 5 | Sun: 100</p>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/plant-system.js"></script>
    <script src="js/enemy-system.js"></script>
    <script src="js/resource-system.js"></script>
    <script src="js/wave-system.js"></script>
    <script src="js/defense-system.js"></script>
    <script src="js/tower-system.js"></script>
    <script src="js/win-screen.js"></script>
    <script src="js/boss-system.js"></script>
    <script src="js/continue.js"></script>
